<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Leerpunt · beveiligd</title>
  <link rel="icon" href="../assets/logo/leerpunt-logo.png">
  <style>
    @font-face { font-family: "Figtree"; src: url("../assets/fonts/Figtree-VariableFont_wght.ttf") format("truetype"); font-weight: 300 900; font-display: swap; }
    :root { --heroisch: #00488c; --ambitieus: #5567d8; --hemels: #dae0f3; --nacht: #00355a; --creme: #f5f2e6; --geel: #ffde7a; --wit: #fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { display: grid; place-items: center; padding: 16px; background: var(--hemels); color: var(--nacht); font-family: "Figtree", Arial, sans-serif; overflow: hidden; position: relative; }
    body::before { content: ""; position: fixed; right: -30vmax; bottom: -55vmax; width: 100vmax; aspect-ratio: 1; border-radius: 50%; background: var(--creme); }
    .card { position: relative; width: min(100%, 400px); padding: 36px 32px 30px; border-radius: 20px; background: var(--wit); box-shadow: 0 30px 60px -30px rgb(0 53 90 / .35); }
    .card img { width: 92px; margin-bottom: 28px; }
    h1 { font-size: 26px; font-weight: 800; color: var(--ambitieus); line-height: 1.15; }
    p { margin-top: 8px; font-size: 15px; color: color-mix(in srgb, var(--nacht) 72%, var(--wit)); }
    form { margin-top: 24px; display: grid; gap: 12px; }
    input[type=password] { width: 100%; height: 46px; padding: 0 16px; border-radius: 99px; border: 1.5px solid color-mix(in srgb, var(--nacht) 22%, var(--wit)); font: inherit; font-size: 16px; color: var(--nacht); }
    input[type=password]:focus { outline: none; border-color: var(--ambitieus); box-shadow: 0 0 0 3px rgb(85 103 216 / .2); }
    label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    button { height: 46px; border: 0; border-radius: 99px; background: var(--nacht); color: var(--wit); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    .error { min-height: 20px; font-size: 14px; color: #b23a2e; }
  </style>
</head>

      <button id="go" type="submit">Openen</button>
      <div class="error" id="err" role="alert"></div>
    </form>
  </main>

    const STORE = "leerpunt-gids-sleutel";
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

    async function keyFromPassword(pw) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
      return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base, 256);
    }
    async function open(raw) {
      const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(DATA));
      const html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    }
    const read = (k) => { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch (e) { return null; } };
    const forget = () => { try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (e) {} };

    // eerder ontgrendeld in deze sessie of op dit toestel? dan meteen openen
    const saved = read(STORE);
    if (saved) open(b64(saved)).catch(forget);

    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("go"), err = document.getElementById("err");
      btn.disabled = true; btn.textContent = "Openen…"; err.textContent = "";
      try {
        const raw = await keyFromPassword(document.getElementById("pw").value);
        try {
          (document.getElementById("remember").checked ? localStorage : sessionStorage).setItem(STORE, toB64(raw));
        } catch (e2) {}
        await open(raw);
      } catch (e3) {
        forget();
        err.textContent = "Dat wachtwoord klopt niet.";
        btn.disabled = false; btn.textContent = "Openen";
        document.getElementById("pw").select();
      }
    });
